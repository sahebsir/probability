{t:'Today’s Goals',h:C(`<b>In this class we will learn:</b><ul><li>Probability as a number attached to each outcome</li><li>The axioms of probability</li><li>P(E) = n(E) / n(S) for equally likely outcomes</li><li>P(not A) and P(A or B)</li><li>Worked examples and practice</li></ul>`)+FM('Big idea: the probability of an event = sum of its outcomes.')},
